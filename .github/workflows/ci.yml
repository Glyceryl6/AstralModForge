name: Java checks and Rider plugin build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Configure Gradle 9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - name: Core checks
        run: gradle --no-daemon coreChecks
      - name: Build official Rider plugin ZIP
        run: gradle --no-daemon buildPlugin
      - name: Upload Rider plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: AstralModForge-Rider-v0.3.0
          path: build/distributions/*.zip
          if-no-files-found: error
